aid: niantic-8thwall
name: 8th Wall
description: >-
  8th Wall is a web-based augmented reality (WebAR) platform originally
  founded in 2016 and acquired by Niantic in March 2022. Following Niantic's
  2025 sale of its gaming division to Scopely and the spin-off of Niantic
  Spatial, Inc. as an independent geospatial AI and XR company, 8th Wall's
  hosted cloud editor, login, and Niantic Studio services were retired on
  February 28, 2026 and the platform transitioned to a free, open-source
  distribution model. Existing published 8th Wall experiences continue to
  run through February 28, 2027. The 8th Wall stack centers on the XR
  Engine — a SLAM-based WebAR runtime providing World Tracking, Image
  Targets, Face Effects, Sky Segmentation, and World Effects — exposed to
  developers as a TypeScript/JavaScript SDK that integrates with A-Frame,
  three.js, PlayCanvas, and Babylon.js. The Distributed Engine Binary
  (released January 2026) ships SLAM under a binary-only license for
  commercial and noncommercial use, while the surrounding framework,
  utilities, and example projects are MIT-licensed on the 8thwall GitHub
  organization. 8th Wall Studio (formerly Niantic Studio) is a real-time
  visual editor and game engine for authoring 3D and XR experiences that
  can be deployed to any web host. 8th Wall does not publish a public REST
  or HTTP API; the developer surface is a client-side JavaScript SDK plus
  command-line and utility tooling distributed through GitHub.
